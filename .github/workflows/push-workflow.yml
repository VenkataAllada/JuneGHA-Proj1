name: Push_Workflow
on: 
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - release-*
    workflow_dispatch:
    schedule:
        - cron: '*/2 * * * *'            

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: Print Greeting
              run: echo "Hello World"
            - name: Print GoodBye
              run: |
               echo "This is my first GHA"
               echo "Workflow executed sucessfully"                